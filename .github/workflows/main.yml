name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'
  # Force clean Vercel builds. VERCEL_FORCE_NO_BUILD_CACHE skips Vercel's
  # Build Cache, TURBO_FORCE skips Turborepo cache, and deploy uses --force.
  VERCEL_FORCE_NO_BUILD_CACHE: '1'
  TURBO_FORCE: 'true'
  NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # Public seller/compliance disclosure. These are not browser secrets; they
  # render in footer/contact/legal/invoice/JSON-LD surfaces. GitHub does not
  # expose repository secrets/variables to steps unless they are mapped here.
  NEXT_PUBLIC_VERDEBLISS_LEGAL_NAME: ${{ vars.NEXT_PUBLIC_VERDEBLISS_LEGAL_NAME || secrets.NEXT_PUBLIC_VERDEBLISS_LEGAL_NAME }}
  NEXT_PUBLIC_VERDEBLISS_CIN: ${{ vars.NEXT_PUBLIC_VERDEBLISS_CIN || secrets.NEXT_PUBLIC_VERDEBLISS_CIN }}
  NEXT_PUBLIC_VERDEBLISS_GSTIN: ${{ vars.NEXT_PUBLIC_VERDEBLISS_GSTIN || secrets.NEXT_PUBLIC_VERDEBLISS_GSTIN }}
  NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_LINE1: ${{ vars.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_LINE1 || secrets.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_LINE1 }}
  NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_CITY: ${{ vars.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_CITY || secrets.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_CITY }}
  NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_STATE: ${{ vars.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_STATE || secrets.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_STATE }}
  NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_PINCODE: ${{ vars.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_PINCODE || secrets.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_PINCODE }}
  NEXT_PUBLIC_VERDEBLISS_PRINCIPAL_PLACE_OF_BUSINESS: ${{ vars.NEXT_PUBLIC_VERDEBLISS_PRINCIPAL_PLACE_OF_BUSINESS || secrets.NEXT_PUBLIC_VERDEBLISS_PRINCIPAL_PLACE_OF_BUSINESS }}
  NEXT_PUBLIC_VERDEBLISS_SUPPORT_PHONE_DISPLAY: ${{ vars.NEXT_PUBLIC_VERDEBLISS_SUPPORT_PHONE_DISPLAY || secrets.NEXT_PUBLIC_VERDEBLISS_SUPPORT_PHONE_DISPLAY }}
  NEXT_PUBLIC_VERDEBLISS_SUPPORT_PHONE_HREF: ${{ vars.NEXT_PUBLIC_VERDEBLISS_SUPPORT_PHONE_HREF || secrets.NEXT_PUBLIC_VERDEBLISS_SUPPORT_PHONE_HREF }}
  NEXT_PUBLIC_VERDEBLISS_SUPPORT_HOURS: ${{ vars.NEXT_PUBLIC_VERDEBLISS_SUPPORT_HOURS || secrets.NEXT_PUBLIC_VERDEBLISS_SUPPORT_HOURS }}
  NEXT_PUBLIC_VERDEBLISS_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_SUPPORT_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_SUPPORT_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_PRIVACY_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_PRIVACY_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_PRIVACY_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_RETURNS_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_RETURNS_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_RETURNS_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_REACTIONS_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_REACTIONS_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_REACTIONS_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_PRESS_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_PRESS_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_PRESS_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_ORDERS_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_ORDERS_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_ORDERS_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_OFFICER_NAME: ${{ vars.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_OFFICER_NAME || secrets.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_OFFICER_NAME }}
  NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_OFFICER_DESIGNATION: ${{ vars.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_OFFICER_DESIGNATION || secrets.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_OFFICER_DESIGNATION }}
  NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_ACK_WINDOW: ${{ vars.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_ACK_WINDOW || secrets.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_ACK_WINDOW }}
  NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_RESOLUTION_WINDOW: ${{ vars.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_RESOLUTION_WINDOW || secrets.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_RESOLUTION_WINDOW }}
  # Turnstile is split across client/server env. Because this workflow creates
  # a prebuilt Vercel bundle inside GitHub Actions, the NEXT_PUBLIC site key
  # must exist here at build time; Vercel runtime env alone cannot patch it
  # into an already-built client bundle.
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
  TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
  LAUNCH_MODE: ${{ vars.LAUNCH_MODE || secrets.LAUNCH_MODE }}
  VERDEBLISS_ENFORCE_COMPLIANCE: ${{ vars.VERDEBLISS_ENFORCE_COMPLIANCE || secrets.VERDEBLISS_ENFORCE_COMPLIANCE }}
  LEGAL_DATA_VERIFIED: ${{ vars.LEGAL_DATA_VERIFIED || secrets.LEGAL_DATA_VERIFIED }}

jobs:
  quality:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
        env:
          LAUNCH_MODE: 'false'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://localhost:54321' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon-key' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://localhost:54321' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon-key' }}

  accessibility:
    name: Accessibility (axe + Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon-key' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'rzp_test_accessibility' }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon-key' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'rzp_test_accessibility' }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon-key' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'rzp_test_playwright' }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          E2E_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          E2E_STATIC_CATALOGUE: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon-key' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'rzp_test_playwright' }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          E2E_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  schema-drift:
    name: Schema Drift (Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2.1.0
        with:
          version: latest
      - run: npm run schema:drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-preview:
    name: Preview Deploy (Vercel)
    runs-on: ubuntu-latest
    needs: [quality, typecheck, test, build, accessibility, e2e, schema-drift]
    if: github.event_name == 'pull_request'
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # See deploy-production: required so preview PDPs prerender real prices
          # (Sensitive in Vercel, so not provided by `vercel pull`). Server-only.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          LEGAL_DATA_VERIFIED: ${{ secrets.LEGAL_DATA_VERIFIED || vars.LEGAL_DATA_VERIFIED }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      - id: deploy
        run: echo "preview_url=$(vercel deploy --prebuilt --force --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT
      # Revalidate the preview deployment's ISR cache so any compliance-identity
      # env vars baked at preview-build time are refreshed in the served HTML.
      # Soft-fail: preview REVALIDATE_SECRET may legitimately differ from prod.
      - name: Revalidate ISR cache (preview)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          DEPLOY_URL: ${{ steps.deploy.outputs.preview_url }}
          MIN_REVALIDATED_PRODUCTS: '0'
        run: |
          if [ -z "${REVALIDATE_SECRET}" ]; then
            echo "REVALIDATE_SECRET not set — skipping preview revalidation (non-fatal)."
            exit 0
          fi
          node scripts/trigger-revalidate.mjs
      # Smoke test every sitemap URL and verify placeholder data plus build SHA
      # consistency across the served preview HTML.
      - name: Smoke test (preview — sitemap-wide served HTML)
        env:
          SMOKE_URL: ${{ steps.deploy.outputs.preview_url }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: node scripts/smoke-test.mjs
      - uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
              body: `🌿 **Preview:** ${{ steps.deploy.outputs.preview_url }}`
            })

  predeploy-production-gates:
    name: Predeploy Production Gates
    runs-on: ubuntu-latest
    needs: [quality, typecheck, test, build, accessibility, e2e, schema-drift]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - name: Launch gates (production DB + active product claims)
        run: npm run test:launch
        env:
          LAUNCH_MODE: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          LEGAL_DATA_VERIFIED: ${{ secrets.LEGAL_DATA_VERIFIED || vars.LEGAL_DATA_VERIFIED }}

  deploy-production:
    name: Production Deploy (Vercel)
    runs-on: ubuntu-latest
    needs:
      [
        quality,
        typecheck,
        test,
        build,
        accessibility,
        e2e,
        schema-drift,
        predeploy-production-gates,
      ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Server-only admin key. Required at build so getProductServer reads the
          # live catalogue and PDPs prerender with real prices. Vercel marks it
          # "Sensitive", so `vercel pull` does not download it — without this line
          # the prerender falls back to price-0 shells ("Price temporarily
          # unavailable"). No NEXT_PUBLIC_ prefix, so it never reaches the client bundle.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          LEGAL_DATA_VERIFIED: ${{ secrets.LEGAL_DATA_VERIFIED || vars.LEGAL_DATA_VERIFIED }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      - run: vercel deploy --prebuilt --prod --force --token=${{ secrets.VERCEL_TOKEN }}
      # Revalidate every public sitemap route and every PDP immediately after
      # the new build goes live.
      # IMPORTANT: A CDN cache purge alone does NOT fix stale ISR HTML — this step
      # is required. Missing REVALIDATE_SECRET is a hard failure (exit 1): a deploy
      # without revalidation leaves legally-mandated seller data potentially stale.
      # See audit finding P0-1 for the root-cause explanation.
      - name: Revalidate ISR cache (products + static routes)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          DEPLOY_URL: 'https://www.verdebliss.com'
          MIN_REVALIDATED_PRODUCTS: '1'
        run: node scripts/trigger-revalidate.mjs
      # Smoke test: fetches every URL from sitemap.xml and verifies placeholder
      # legal data plus x-build-sha consistency across all public pages.
      - name: Smoke test (production — sitemap-wide served HTML)
        env:
          SMOKE_URL: 'https://www.verdebliss.com'
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: node scripts/smoke-test.mjs

  lighthouse:
    name: Lighthouse CI (CWV)
    runs-on: ubuntu-latest
    needs: [deploy-preview]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run Lighthouse CI against preview
        run: |
          BASE="${{ needs.deploy-preview.outputs.preview_url }}"
          npx lhci autorun \
            --collect.url="${BASE}/" \
            --collect.url="${BASE}/products" \
            --collect.url="${BASE}/products/bakuchiol-renewal-serum" \
            --collect.url="${BASE}/account" \
            --collect.url="${BASE}/quiz"
        env:
          # Optional: wire up the Lighthouse CI GitHub App for PR status checks.
          # Create the app at https://github.com/apps/lighthouse-ci and add the
          # token as LHCI_GITHUB_APP_TOKEN in repository secrets.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30
