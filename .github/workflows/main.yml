name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  # Public seller/compliance disclosure. These are not browser secrets; they
  # render in footer/contact/legal/invoice/JSON-LD surfaces. GitHub does not
  # expose repository secrets/variables to steps unless they are mapped here.
  NEXT_PUBLIC_VERDEBLISS_LEGAL_NAME: ${{ vars.NEXT_PUBLIC_VERDEBLISS_LEGAL_NAME || secrets.NEXT_PUBLIC_VERDEBLISS_LEGAL_NAME }}
  NEXT_PUBLIC_VERDEBLISS_CIN: ${{ vars.NEXT_PUBLIC_VERDEBLISS_CIN || secrets.NEXT_PUBLIC_VERDEBLISS_CIN }}
  NEXT_PUBLIC_VERDEBLISS_GSTIN: ${{ vars.NEXT_PUBLIC_VERDEBLISS_GSTIN || secrets.NEXT_PUBLIC_VERDEBLISS_GSTIN }}
  NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_LINE1: ${{ vars.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_LINE1 || secrets.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_LINE1 }}
  NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_CITY: ${{ vars.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_CITY || secrets.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_CITY }}
  NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_STATE: ${{ vars.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_STATE || secrets.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_STATE }}
  NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_PINCODE: ${{ vars.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_PINCODE || secrets.NEXT_PUBLIC_VERDEBLISS_REGISTERED_OFFICE_PINCODE }}
  NEXT_PUBLIC_VERDEBLISS_PRINCIPAL_PLACE_OF_BUSINESS: ${{ vars.NEXT_PUBLIC_VERDEBLISS_PRINCIPAL_PLACE_OF_BUSINESS || secrets.NEXT_PUBLIC_VERDEBLISS_PRINCIPAL_PLACE_OF_BUSINESS }}
  NEXT_PUBLIC_VERDEBLISS_SUPPORT_PHONE_DISPLAY: ${{ vars.NEXT_PUBLIC_VERDEBLISS_SUPPORT_PHONE_DISPLAY || secrets.NEXT_PUBLIC_VERDEBLISS_SUPPORT_PHONE_DISPLAY }}
  NEXT_PUBLIC_VERDEBLISS_SUPPORT_PHONE_HREF: ${{ vars.NEXT_PUBLIC_VERDEBLISS_SUPPORT_PHONE_HREF || secrets.NEXT_PUBLIC_VERDEBLISS_SUPPORT_PHONE_HREF }}
  NEXT_PUBLIC_VERDEBLISS_SUPPORT_HOURS: ${{ vars.NEXT_PUBLIC_VERDEBLISS_SUPPORT_HOURS || secrets.NEXT_PUBLIC_VERDEBLISS_SUPPORT_HOURS }}
  NEXT_PUBLIC_VERDEBLISS_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_SUPPORT_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_SUPPORT_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_PRIVACY_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_PRIVACY_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_PRIVACY_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_RETURNS_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_RETURNS_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_RETURNS_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_REACTIONS_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_REACTIONS_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_REACTIONS_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_PRESS_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_PRESS_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_PRESS_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_ORDERS_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_ORDERS_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_ORDERS_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_OFFICER_NAME: ${{ vars.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_OFFICER_NAME || secrets.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_OFFICER_NAME }}
  NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_OFFICER_DESIGNATION: ${{ vars.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_OFFICER_DESIGNATION || secrets.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_OFFICER_DESIGNATION }}
  NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_EMAIL: ${{ vars.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_EMAIL || secrets.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_EMAIL }}
  NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_ACK_WINDOW: ${{ vars.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_ACK_WINDOW || secrets.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_ACK_WINDOW }}
  NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_RESOLUTION_WINDOW: ${{ vars.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_RESOLUTION_WINDOW || secrets.NEXT_PUBLIC_VERDEBLISS_GRIEVANCE_RESOLUTION_WINDOW }}
  LAUNCH_MODE: ${{ vars.LAUNCH_MODE || secrets.LAUNCH_MODE }}
  VERDEBLISS_ENFORCE_COMPLIANCE: ${{ vars.VERDEBLISS_ENFORCE_COMPLIANCE || secrets.VERDEBLISS_ENFORCE_COMPLIANCE }}

jobs:
  quality:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://localhost:54321' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon-key' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://localhost:54321' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon-key' }}

  accessibility:
    name: Accessibility (axe + Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon-key' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'rzp_test_accessibility' }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon-key' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'rzp_test_accessibility' }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon-key' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'rzp_test_playwright' }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          E2E_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon-key' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID || 'rzp_test_playwright' }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          E2E_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  schema-drift:
    name: Schema Drift (Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2.1.0
        with:
          version: latest
      - run: npm run schema:drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-preview:
    name: Preview Deploy (Vercel)
    runs-on: ubuntu-latest
    needs: [quality, typecheck, test, build, accessibility, e2e, schema-drift]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
      - id: deploy
        run: echo "preview_url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> $GITHUB_OUTPUT
      - uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo,
              body: `🌿 **Preview:** ${{ steps.deploy.outputs.preview_url }}`
            })

  deploy-production:
    name: Production Deploy (Vercel)
    runs-on: ubuntu-latest
    needs: [quality, typecheck, test, build, accessibility, e2e, schema-drift]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
      # Force-revalidate all product ISR caches immediately after the new build
      # goes live. Without this, stale rendered HTML from the previous build can
      # persist for up to revalidate=300s (or indefinitely on low-traffic PDPs).
      # generateStaticParams pre-builds all PDPs, but this belt-and-suspenders
      # step ensures the route cache is cleared even if the prerender is somehow
      # served from a previous ISR snapshot.
      - name: Revalidate ISR cache (products + FAQ + certifications)
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "${REVALIDATE_SECRET}" ]; then
            echo "⚠️  REVALIDATE_SECRET not set — skipping on-demand revalidation."
            echo "    Add it as a GitHub Actions secret and a Vercel production env var"
            echo "    (openssl rand -hex 32) to enable immediate post-deploy cache purge."
            exit 0
          fi
          curl -sS -X POST \
            "https://www.verdebliss.com/api/revalidate" \
            -H "x-revalidate-secret: ${REVALIDATE_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail --retry 3 --retry-delay 10
