version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      frontend-runtime:
        patterns:
          - next
          - react
          - react-dom
          - "@supabase/*"
          - "@upstash/*"
      frontend-tooling:
        patterns:
          - postcss
          - tailwindcss
          - "@tailwindcss/*"
          - eslint*
          - typescript
          - vitest

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Kolkata
