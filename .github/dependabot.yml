version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Temporarily disabled by request. Restore to 10 when automated
    # dependency PRs should resume.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    groups:
      frontend-runtime:
        patterns:
          - next
          - react
          - react-dom
          - '@supabase/*'
          - '@upstash/*'
      frontend-tooling:
        patterns:
          - postcss
          - tailwindcss
          - '@tailwindcss/*'
          - eslint*
          - typescript
          - vitest

  - package-ecosystem: github-actions
    directory: /
    # Temporarily disabled by request. Restore to 5 when automated
    # workflow action PRs should resume.
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Kolkata
